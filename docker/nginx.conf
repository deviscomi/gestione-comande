# Header Connection dinamico per l'upgrade WebSocket (contesto http).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # DNS Docker embedded: forza la ri-risoluzione periodica di app/reverb
    # invece della cache statica di default (risolta una volta sola all'avvio
    # di nginx). Senza questo, un riavvio isolato di 'app' o 'reverb' — anche
    # solo per un deploy — lascia nginx a bussare a un IP ormai morto (502)
    # finché non si riavvia anche nginx stesso.
    resolver 127.0.0.11 valid=10s;

    # WebSocket real-time (Reverb) — proxato sulla STESSA porta dell'app.
    # Il client Laravel Echo si connette a ws://<host>/app/<key>: una sola porta
    # da aprire nel firewall, nessuna configurazione per-dispositivo sui tablet.
    location ^~ /app/ {
        set $reverb_upstream reverb;
        proxy_pass http://$reverb_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Serve backend API + Laravel
    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $app_upstream app;
        fastcgi_pass $app_upstream:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Service worker e workbox: mai in cache (devono essere sempre aggiornati)
    location ~* (sw\.js|workbox-[^.]+\.js|registerSW\.js)$ {
        root /var/www/frontend;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Assets con hash nel nome: cache lunga (Vite li rinomina ad ogni build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        root /var/www/frontend;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # webmanifest: cache breve (può cambiare senza cambio hash)
    location ~* \.webmanifest$ {
        root /var/www/frontend;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html: mai in cache (punto di ingresso della SPA)
    location = /index.html {
        root /var/www/frontend;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Frontend SPA - tutte le altre route → index.html
    location / {
        root /var/www/frontend;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}
